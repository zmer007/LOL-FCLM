server {
    listen 80;
    server_name _;

    # 视频上传上限（与后端 MAX_VIDEO_MB=200 对齐，略留余量）
    client_max_body_size 220m;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 API 反代（compose 内网服务名 api:9090）
    location /api/ {
        proxy_pass http://api:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传/导入需要更长超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 用户上传文件：反代给后端 api（api 用 r.Static 提供 /media）
    location /media/ {
        proxy_pass http://api:9090/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Data Dragon 官方图标：反代给后端 api（api 直接从 assets 提供 /ddragon）
    location /ddragon/ {
        proxy_pass http://api:9090/ddragon/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存（确保发版后立即生效）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 入口 chunk（index-*.js/css）不缓存：其内含动态 chunk 映射，发版后需立即刷新
    location ~ ^/assets/index-[a-zA-Z0-9_-]+\.(js|css)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
