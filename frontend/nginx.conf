server {
    listen 80;
    server_name _;

    # 视频上传上限（与后端 MAX_VIDEO_MB=200 对齐，略留余量）
    client_max_body_size 220m;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 API 反代（compose 内网服务名 api:9090）
    location /api/ {
        proxy_pass http://api:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 用户上传文件（三方共享的 lol_media 卷，Nginx 只读挂载）
    location /media/ {
        alias /data/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存（确保发版后立即生效）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 入口 chunk（index-*.js/css）不缓存：其内含动态 chunk 映射，发版后需立即刷新
    location ~ ^/assets/index-[a-zA-Z0-9_-]+\.(js|css)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
