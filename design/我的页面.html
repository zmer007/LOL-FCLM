<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的 · 路边联盟</title>
<style>
  :root {
    --bg: #070E16;
    --panel: #0E1C2C;
    --panel-2: #132438;
    --line: #22394F;
    --line-soft: #1B2E42;
    --gold: #C8AA6E;
    --gold-bright: #F0E6D2;
    --cyan: #0AC8B9;
    --red: #E84057;
    --mute: #8FA3B8;
    --faint: #5F7387;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--gold-bright);
    min-height: 100vh;
  }

  /* ============ 顶部导航（与其他页一致） ============ */
  header {
    height: 62px;
    padding: 0 40px;
    display: flex; align-items: center; gap: 36px;
    border-bottom: 1px solid var(--line-soft);
    position: sticky; top: 0; z-index: 10;
    background: rgba(7,14,22,.92);
  }
  nav { display: flex; gap: 28px; font-size: 14px; }
  nav a { color: var(--mute); text-decoration: none; cursor: pointer; }
  nav a.on { color: var(--gold-bright); }
  .avatar {
    margin-left: auto;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--gold);
    background: var(--panel); color: var(--gold);
    display: grid; place-items: center; font-size: 13px;
    text-decoration: none;
  }
  .avatar.on {
    background: var(--gold); color: #0A1428; font-weight: 700;
    box-shadow: 0 0 12px rgba(200,170,110,.4);
  }

  main { max-width: 900px; margin: 0 auto; padding: 0 24px 60px; }

  /* ============ 个人卡片 ============ */
  .profile {
    margin-top: 26px;
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 16px;
    padding: 28px 32px;
    display: flex; align-items: center; gap: 24px;
  }
  .p-avatar {
    width: 80px; height: 80px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid var(--gold);
    background: var(--panel-2); color: var(--gold);
    display: grid; place-items: center;
    font-size: 26px; font-weight: 700;
  }
  .p-info { flex: 1; min-width: 0; }
  .p-name { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
  .p-id { margin-top: 5px; font-size: 12px; color: var(--faint); }
  .p-sign { margin-top: 10px; font-size: 13px; color: var(--mute); }
  .p-stats { display: flex; gap: 0; flex-shrink: 0; }
  .p-stat {
    text-align: center; padding: 0 22px; border-left: 1px solid var(--line-soft);
    cursor: pointer;
  }
  .p-stat:first-child { border-left: 0; }
  .p-stat b { display: block; font-size: 20px; color: var(--gold); font-weight: 700; transition: color .15s; }
  .p-stat:hover b { color: var(--gold-bright); }
  .p-stat span { display: block; margin-top: 4px; font-size: 12px; color: var(--faint); }
  .p-stat:hover span { color: var(--mute); }

  /* ============ 模块卡片 ============ */
  .section {
    margin-top: 22px;
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 16px;
    padding: 24px 28px 26px;
  }
  .section-title {
    font-size: 16px; font-weight: 700; color: var(--gold-bright);
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 20px;
  }
  .section-title::before {
    content: ""; width: 3px; height: 15px; background: var(--gold); border-radius: 2px;
  }
  .section-title .more {
    margin-left: auto;
    font-size: 12.5px; font-weight: 400; color: var(--faint);
    text-decoration: none; cursor: pointer;
  }
  .section-title .more:hover { color: var(--gold); }

  /* 收藏：英雄 / 视频 小 tab */
  .subtabs { display: flex; gap: 8px; margin: -6px 0 20px; }
  .subtab {
    font-family: inherit; font-size: 12.5px; cursor: pointer;
    background: none; border: 1px solid var(--line); border-radius: 999px;
    color: var(--faint); padding: 4px 16px;
  }
  .subtab:hover { color: var(--mute); }
  .subtab.on { border-color: var(--gold); color: var(--gold); }
  .subpane { display: none; }
  .subpane.on { display: block; }

  /* 收藏英雄 */
  .fav-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap: 18px 14px;
  }
  .fav-champ { text-align: center; text-decoration: none; color: inherit; cursor: pointer; }
  .fav-portrait {
    width: 72px; height: 72px; margin: 0 auto;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: linear-gradient(135deg, #1C3350, #132438);
    display: grid; place-items: center;
    font-size: 11px; color: var(--faint);
    transition: border-color .15s, transform .15s;
  }
  .fav-champ:hover .fav-portrait { border-color: var(--gold); transform: translateY(-2px); }
  .fav-name { margin-top: 8px; font-size: 12.5px; color: var(--gold-bright); }

  /* 收藏视频 / 观看历史：行列表 */
  .vrow {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 4px;
    border-top: 1px solid var(--line-soft);
    text-decoration: none; color: inherit; cursor: pointer;
  }
  .vrow:first-child { border-top: 0; }
  .vrow:hover .vrow-title { color: var(--gold); }
  .vrow-thumb {
    position: relative;
    width: 110px; height: 62px; flex-shrink: 0;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #0A1520;
    display: grid; place-items: center;
  }
  .vrow-thumb.pro { border-color: rgba(10,200,185,.5); }
  .vrow-thumb.con { border-color: rgba(232,64,87,.5); }
  .vrow-badge {
    position: absolute; left: 0; top: 0;
    font-size: 10px; font-weight: 700; line-height: 1;
    padding: 4px 8px; border-radius: 8px 0 6px 0;
    color: #04141A;
  }
  .vrow-badge.pro { background: var(--cyan); }
  .vrow-badge.con { background: var(--red); color: var(--gold-bright); }
  .vrow-body { flex: 1; min-width: 0; }
  .vrow-title {
    font-size: 13.5px; color: var(--gold-bright);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: color .15s;
  }
  .vrow-meta { margin-top: 5px; font-size: 11.5px; color: var(--faint); }

  /* 审批中列表 */
  .review-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 4px;
    border-top: 1px solid var(--line-soft);
    text-decoration: none; color: inherit; cursor: pointer;
  }
  .review-row:first-child { border-top: 0; }
  .review-row:hover .rv-title { color: var(--gold); }
  .rv-thumb {
    width: 110px; height: 62px; flex-shrink: 0;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #0A1520;
    display: grid; place-items: center;
    color: var(--faint);
  }
  .rv-thumb .play {
    width: 0; height: 0;
    border-left: 13px solid var(--faint);
    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
  }
  .review-row:hover .play { border-left-color: var(--gold); }
  .rv-body { flex: 1; min-width: 0; }
  .rv-title {
    font-size: 13.5px; color: var(--gold-bright);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: color .15s;
  }
  .rv-meta { margin-top: 5px; font-size: 11.5px; color: var(--faint); }
  .rv-status {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--gold);
    border: 1px solid var(--gold); border-radius: 999px;
    padding: 5px 13px;
  }
  .rv-status .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    animation: rv-pulse 1.4s ease-in-out infinite;
  }
  @keyframes rv-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .3; }
  }

  /* 账号菜单 */
  .menu-row {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 4px;
    border-top: 1px solid var(--line-soft);
    font-size: 13.5px; color: var(--mute);
    cursor: pointer;
  }
  .menu-row:first-child { border-top: 0; }
  .menu-row:hover { color: var(--gold); }
  .menu-row .chev { margin-left: auto; color: var(--faint); }

  .empty-note {
    text-align: center; color: var(--faint); font-size: 13px;
    padding: 30px 0;
  }

  @media (max-width: 720px) {
    .profile { flex-direction: column; align-items: flex-start; gap: 18px; }
    .p-stats { width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>

  <header>
    <nav>
      <a href="首页设计.html">首页</a>
      <a href="关于页面.html">关于</a>
    </nav>
    <a class="avatar on" href="我的页面.html">我</a>
  </header>

  <main>
    <!-- 个人卡片 -->
    <section class="profile">
      <div class="p-avatar">我</div>
      <div class="p-info">
        <div class="p-name">用户昵称占位</div>
        <div class="p-id">ID：00000000 · 路边的一名召唤师</div>
        <div class="p-sign">签名占位：这个人很神秘，什么都没有留下。</div>
      </div>
      <div class="p-stats">
        <div class="p-stat" data-pane="champ" role="button"><b id="statFavChamp">0</b><span>收藏英雄</span></div>
        <div class="p-stat" data-pane="video" role="button"><b id="statFavVideo">0</b><span>收藏视频</span></div>
      </div>
    </section>

    <!-- 我的收藏 -->
    <section class="section" id="favSection" style="scroll-margin-top:80px;">
      <div class="section-title">我的收藏</div>
      <div class="subtabs" id="favTabs">
        <button class="subtab on" data-pane="champ">英雄</button>
        <button class="subtab" data-pane="video">视频</button>
      </div>

      <div class="subpane on" id="pane-champ">
        <div class="fav-grid" id="favChampGrid"></div>
      </div>

      <div class="subpane" id="pane-video">
        <div id="favVideoList"></div>
      </div>
    </section>

    <!-- 审批中：我提交、待审核的视频 / 图文 -->
    <section class="section">
      <div class="section-title">审批中</div>
      <div id="reviewList"></div>
    </section>

    <!-- 账号 -->
    <section class="section">
      <div class="section-title">账号</div>
      <div class="menu-row">账号设置 <span class="chev">›</span></div>
      <div class="menu-row">意见反馈 <span class="chev">›</span></div>
    </section>
  </main>

  <script>
    /* ============ 收藏英雄（占位）：点击进入对应英雄的对线页 ============ */
    var favChamps = [];
    for (var i = 1; i <= 6; i++) favChamps.push('英雄 ' + i);
    document.getElementById('favChampGrid').innerHTML = favChamps.map(function (name) {
      return '<a class="fav-champ" href="对线页面.html">' +
               '<div class="fav-portrait">英雄图片</div>' +
               '<div class="fav-name">' + name + '</div>' +
             '</a>';
    }).join('');

    /* ============ 收藏视频（占位）：点击进入视频详情页 ============ */
    var favVideos = [
      { title: '收藏视频标题占位 1', meta: 'UP主占位 · 播放量占位', type: 'pro' },
      { title: '收藏视频标题占位 2', meta: 'UP主占位 · 播放量占位', type: 'con' },
      { title: '收藏视频标题占位 3', meta: 'UP主占位 · 播放量占位', type: 'pro' },
      { title: '收藏视频标题占位 4', meta: 'UP主占位 · 播放量占位', type: 'pro' },
      { title: '收藏视频标题占位 5', meta: 'UP主占位 · 播放量占位', type: 'con' },
      { title: '收藏视频标题占位 6', meta: 'UP主占位 · 播放量占位', type: 'pro' },
      { title: '收藏视频标题占位 7', meta: 'UP主占位 · 播放量占位', type: 'con' },
      { title: '收藏视频标题占位 8', meta: 'UP主占位 · 播放量占位', type: 'pro' }
    ];
    function vrow(v) {
      return '<a class="vrow" href="视频详情页.html">' +
        '<div class="vrow-thumb ' + v.type + '">' +
          '<span class="vrow-badge ' + v.type + '">' + (v.type === 'pro' ? '本英雄' : '对位英雄') + '</span>' +
        '</div>' +
        '<div class="vrow-body">' +
          '<div class="vrow-title">' + v.title + '</div>' +
          '<div class="vrow-meta">' + v.meta + '</div>' +
        '</div>' +
      '</a>';
    }
    document.getElementById('favVideoList').innerHTML = favVideos.map(vrow).join('');

    /* 统计数字与列表数据保持一致 */
    document.getElementById('statFavChamp').textContent = favChamps.length;
    document.getElementById('statFavVideo').textContent = favVideos.length;

    /* ============ 审批中（占位） ============ */
    var reviewItems = [
      { type: 'video',   title: '提交的视频标题占位 1', vs: '英雄名称占位 1', time: '提交于 2026-10-13 20:15' },
      { type: 'article', title: '提交的图文标题占位 1', vs: '英雄名称占位 2', time: '提交于 2026-10-13 18:40' },
      { type: 'video',   title: '提交的视频标题占位 2', vs: '英雄名称占位 3', time: '提交于 2026-10-12 22:03' }
    ];
    var ARTICLE_ICON =
      '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>' +
      '<path d="M21 15l-5-5L5 21"/></svg>';

    document.getElementById('reviewList').innerHTML = reviewItems.map(function (it) {
      var isVideo = it.type === 'video';
      var href = isVideo ? '视频编辑页.html' : '图文编辑页.html';
      var thumb = isVideo ? '<span class="play"></span>' : ARTICLE_ICON;
      var typeText = isVideo ? '视频' : '图文';
      return '<a class="review-row" href="' + href + '">' +
        '<div class="rv-thumb">' + thumb + '</div>' +
        '<div class="rv-body">' +
          '<div class="rv-title">' + it.title + '</div>' +
          '<div class="rv-meta">' + typeText + ' · 对位 ' + it.vs + ' · ' + it.time + '</div>' +
        '</div>' +
        '<span class="rv-status"><span class="dot"></span>审批中</span>' +
      '</a>';
    }).join('');

    /* 收藏 tab 切换 */
    var favTabsEl = document.getElementById('favTabs');
    function switchPane(pane) {
      favTabsEl.querySelectorAll('.subtab').forEach(function (b) {
        b.classList.toggle('on', b.dataset.pane === pane);
      });
      document.querySelectorAll('.subpane').forEach(function (p) {
        p.classList.toggle('on', p.id === 'pane-' + pane);
      });
    }
    favTabsEl.addEventListener('click', function (e) {
      var btn = e.target.closest('.subtab');
      if (!btn) return;
      switchPane(btn.dataset.pane);
    });

    /* 点击个人卡片统计：切换到对应收藏列表并滚动定位 */
    document.querySelectorAll('.p-stat').forEach(function (stat) {
      stat.addEventListener('click', function () {
        switchPane(stat.dataset.pane);
        document.getElementById('favSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  </script>

</body>
</html>
