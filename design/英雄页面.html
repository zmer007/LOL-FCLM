<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英雄 · 路边联盟</title>
<style>
  :root {
    --bg: #070E16;
    --panel: #0E1C2C;
    --panel-2: #132438;
    --line: #22394F;
    --line-soft: #1B2E42;
    --gold: #C8AA6E;
    --gold-bright: #F0E6D2;
    --cyan: #0AC8B9;
    --mute: #8FA3B8;
    --faint: #5F7387;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--gold-bright);
    min-height: 100vh;
  }

  /* ============ 顶部导航（与其他页一致） ============ */
  header {
    height: 62px;
    padding: 0 40px;
    display: flex; align-items: center; gap: 36px;
    border-bottom: 1px solid var(--line-soft);
    position: sticky; top: 0; z-index: 10;
    background: rgba(7,14,22,.92);
  }
  nav { display: flex; gap: 28px; font-size: 14px; }
  nav a { color: var(--mute); text-decoration: none; cursor: pointer; }
  nav a.on { color: var(--gold-bright); }
  .avatar {
    margin-left: auto;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--gold);
    background: var(--panel); color: var(--gold);
    display: grid; place-items: center; font-size: 13px;
    cursor: pointer;
  }

  main { max-width: 1040px; margin: 0 auto; padding: 0 24px 60px; }

  .page-head { margin: 28px 0 22px; }
  .page-title { font-size: 24px; font-weight: 800; letter-spacing: 1px; }
  .page-sub { margin-top: 6px; font-size: 13px; color: var(--faint); }

  /* 分路筛选 */
  .toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 26px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter {
    font-family: inherit; font-size: 12.5px; cursor: pointer;
    background: none; border: 1px solid var(--line); border-radius: 999px;
    color: var(--faint); padding: 5px 16px;
  }
  .filter:hover { color: var(--mute); }
  .filter.on { border-color: var(--gold); color: var(--gold); }

  /* 英雄网格 */
  .champ-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 20px 16px;
  }
  .champ {
    text-align: center; cursor: pointer; text-decoration: none; color: inherit;
  }
  .champ-portrait {
    width: 84px; height: 84px; margin: 0 auto;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: linear-gradient(135deg, #1C3350, #132438);
    display: grid; place-items: center;
    font-size: 12px; color: var(--faint);
    transition: border-color .15s, transform .15s;
  }
  .champ:hover .champ-portrait {
    border-color: var(--gold);
    transform: translateY(-3px);
  }
  .champ-name { margin-top: 10px; font-size: 13px; color: var(--gold-bright); }
  .champ-role { margin-top: 3px; font-size: 11px; color: var(--faint); }

  .empty {
    grid-column: 1 / -1;
    text-align: center; color: var(--faint); font-size: 13px;
    padding: 60px 0;
  }
</style>
</head>
<body>

  <header>
    <nav>
      <a href="首页设计.html">首页</a>
      <a class="on">英雄</a>
      <a href="装备符文页面.html">装备&amp;符文</a>
    </nav>
    <div class="avatar">我</div>
  </header>

  <main>
    <div class="page-head">
      <div class="page-title">英雄</div>
      <div class="page-sub">选择英雄，查看技能介绍与等级属性</div>
    </div>

    <div class="toolbar">
      <div class="filters" id="filters">
        <button class="filter on" data-role="全部">全部</button>
        <button class="filter" data-role="上单">上单</button>
        <button class="filter" data-role="打野">打野</button>
        <button class="filter" data-role="中单">中单</button>
        <button class="filter" data-role="下路">下路</button>
        <button class="filter" data-role="辅助">辅助</button>
      </div>
    </div>

    <div class="champ-grid" id="grid"></div>
  </main>

  <script>
    /* 占位英雄数据：名称 + 分路 */
    var ROLES = ['上单', '打野', '中单', '下路', '辅助'];
    var CHAMPS = (function () {
      var list = [];
      for (var i = 1; i <= 30; i++) {
        list.push({ name: '英雄 ' + i, role: ROLES[(i - 1) % 5] });
      }
      return list;
    })();

    var currentRole = '全部';
    var grid = document.getElementById('grid');

    function render() {
      var html = '';
      CHAMPS.forEach(function (c) {
        if (currentRole !== '全部' && c.role !== currentRole) return;
        html +=
          '<a class="champ" href="英雄资料.html">' +
            '<div class="champ-portrait">英雄图片</div>' +
            '<div class="champ-name">' + c.name + '</div>' +
            '<div class="champ-role">' + c.role + '</div>' +
          '</a>';
      });
      if (!html) html = '<div class="empty">没有符合条件的英雄</div>';
      grid.innerHTML = html;
    }

    document.getElementById('filters').addEventListener('click', function (e) {
      var btn = e.target.closest('.filter');
      if (!btn) return;
      this.querySelectorAll('.filter').forEach(function (f) { f.classList.remove('on'); });
      btn.classList.add('on');
      currentRole = btn.dataset.role;
      render();
    });

    render();
  </script>

</body>
</html>
