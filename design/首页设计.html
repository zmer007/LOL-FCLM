<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>废柴联盟</title>
<style>
  :root {
    --bg: #070E16;
    --panel: #0E1C2C;
    --line: #22394F;
    --gold: #C8AA6E;
    --gold-bright: #F0E6D2;
    --faint: #5F7387;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--gold-bright);
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* ============ 顶部导航 ============ */
  header {
    height: 62px; flex-shrink: 0;
    padding: 0 40px;
    display: flex; align-items: center; gap: 36px;
    border-bottom: 1px solid var(--line);
  }
  nav { display: flex; gap: 28px; font-size: 14px; }
  nav span { color: #8FA3B8; cursor: pointer; }
  nav span.on { color: var(--gold-bright); }
  .avatar {
    margin-left: auto;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--gold);
    background: var(--panel); color: var(--gold);
    display: grid; place-items: center; font-size: 13px;
    cursor: pointer;
  }

  /* ============ 搜索区（偏上，类似百度） ============ */
  .center {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 14vh 24px 24px;
  }

  .big-logo {
    font-size: 42px; font-weight: 800; letter-spacing: 6px;
    color: var(--gold-bright);
    margin-bottom: 34px;
    display: flex; align-items: center; gap: 10px;
  }
  .big-logo span:first-child { margin-right: -8px; } /* 视觉居中：两侧字符字面留白不同，非对称补偿 */
  .big-logo span:last-child { margin-left: -2px; }
  .big-logo i { font-style: normal; color: var(--gold); }
  .big-logo svg { width: 46px; height: 46px; flex-shrink: 0; }

  .search {
    width: 100%; max-width: 520px; height: 58px;
    display: flex; align-items: center; gap: 12px;
    padding: 0 10px 0 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    transition: border-color .15s;
  }
  .search:focus-within { border-color: var(--gold); }
  .search .icon { color: var(--faint); font-size: 17px; }
  .search input {
    flex: 1; min-width: 0;
    background: none; border: 0; outline: none;
    color: var(--gold-bright);
    font-size: 16px; font-family: inherit;
  }
  .search input::placeholder { color: var(--faint); }
  .search button {
    height: 42px; padding: 0 26px;
    border: 0; border-radius: 9px;
    background: var(--gold); color: #0A1428;
    font-size: 14px; font-weight: 700; font-family: inherit;
    cursor: pointer;
  }
  .search button:hover { background: var(--gold-bright); }
</style>
</head>
<body>

  <header>
    <nav>
      <span class="on">首页</span>
      <span>英雄</span>
      <span>装备</span>
      <span>符文</span>
    </nav>
    <div class="avatar">我</div>
  </header>

  <div class="center">
    <div class="big-logo">
      <span>废柴</span>
      <!-- 盾牌笑脸 logo：盾形 + 笑眯眯（弯月笑眼 + 微笑） -->
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 4 L40 10 V24 C40 34 33 41 24 44 C15 41 8 34 8 24 V10 Z"
              fill="none" stroke="#C8AA6E" stroke-width="2.5" stroke-linejoin="round"/>
        <!-- 弯月笑眼（左金右青，暗合对线双方） -->
        <path d="M14 21 Q18 16 22 21" stroke="#F0E6D2" stroke-width="2.8" stroke-linecap="round"/>
        <path d="M26 21 Q30 16 34 21" stroke="#0AC8B9" stroke-width="2.8" stroke-linecap="round"/>
        <!-- 微笑 -->
        <path d="M16 30 Q24 38 32 30" stroke="#C8AA6E" stroke-width="2.8" stroke-linecap="round"/>
      </svg>
      <span><i>联盟</i></span>
    </div>

    <form class="search" onsubmit="return false">
      <span class="icon">🔍</span>
      <input type="text" placeholder="输入英雄名称" autofocus>
      <button type="submit">进入</button>
    </form>
  </div>

</body>
</html>
