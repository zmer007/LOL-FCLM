<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英雄名称 · 废柴联盟</title>
<style>
  :root {
    --bg: #070E16;
    --panel: #0E1C2C;
    --panel-2: #132438;
    --line: #22394F;
    --line-soft: #1B2E42;
    --gold: #C8AA6E;
    --gold-bright: #F0E6D2;
    --cyan: #0AC8B9;
    --red: #E84057;
    --mute: #8FA3B8;
    --faint: #5F7387;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--gold-bright);
    min-height: 100vh;
  }

  /* ============ 顶部导航（与首页一致） ============ */
  header {
    height: 62px;
    padding: 0 40px;
    display: flex; align-items: center; gap: 36px;
    border-bottom: 1px solid var(--line-soft);
    position: sticky; top: 0; z-index: 10;
    background: rgba(7,14,22,.92);
  }
  nav { display: flex; gap: 28px; font-size: 14px; }
  nav a { color: var(--mute); text-decoration: none; cursor: pointer; }
  nav a.on { color: var(--gold-bright); }
  .avatar {
    margin-left: auto;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--gold);
    background: var(--panel); color: var(--gold);
    display: grid; place-items: center; font-size: 13px;
    cursor: pointer;
  }

  main { max-width: 960px; margin: 0 auto; padding: 0 24px 60px; }

  /* ============ 返回 ============ */
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 24px; font-size: 13px; color: var(--faint);
    text-decoration: none; cursor: pointer;
  }
  .back:hover { color: var(--gold); }

  /* ============ 英雄横幅 ============ */
  .hero {
    margin-top: 14px;
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 16px;
    padding: 28px 32px;
    display: flex; align-items: center; gap: 24px;
  }
  .portrait {
    width: 96px; height: 96px; border-radius: 16px; flex-shrink: 0;
    border: 1px solid var(--line);
    background: linear-gradient(135deg, #1C3350, #132438);
    display: grid; place-items: center;
    font-size: 13px; color: var(--faint);
  }
  .h-info { flex: 1; min-width: 0; }
  .h-name { font-size: 26px; font-weight: 800; letter-spacing: 1px; }
  .h-title { margin-top: 6px; font-size: 13px; color: var(--mute); }
  .h-tags { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .tag {
    font-size: 12px; padding: 3px 12px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--mute);
  }
  .tag.gold { border-color: var(--gold); color: var(--gold); }
  .fav {
    align-self: flex-start;
    font-size: 12.5px; font-family: inherit; cursor: pointer;
    background: none; border: 1px solid var(--line); border-radius: 8px;
    color: var(--mute); padding: 8px 16px;
  }
  .fav:hover { border-color: var(--gold); color: var(--gold); }

  /* ============ 推荐配置（装备 + 符文，一个主体） ============ */
  .build {
    margin-top: 26px;
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 16px;
    padding: 26px 30px 30px;
  }
  .build-title {
    font-size: 16px; font-weight: 700; color: var(--gold-bright);
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 22px;
  }
  .build-title::before {
    content: ""; width: 3px; height: 15px; background: var(--gold); border-radius: 2px;
  }
  .build-col + .build-col { border-left: 1px solid var(--line-soft); padding-left: 30px; }

  /* 方案 tab 切换 */
  .tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .tab {
    font-family: inherit; font-size: 12.5px; cursor: pointer;
    background: none; border: 1px solid var(--line); border-radius: 8px;
    color: var(--faint);
    width: 30px; height: 28px;
  }
  .tab:hover { color: var(--mute); }
  .tab.on { border-color: var(--gold); color: var(--gold); }
  .panel { display: none; }
  .panel.on { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }

  /* 装备 */
  .item-stage { margin-bottom: 16px; }
  .item-stage:last-child { margin-bottom: 0; }
  .stage-row { display: flex; gap: 28px; }
  .stage-label { font-size: 12px; color: var(--faint); margin-bottom: 8px; }
  .items { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .item {
    width: 48px; height: 48px; border-radius: 9px;
    background: #0A1520; border: 1px solid var(--line);
    display: grid; place-items: center;
    font-size: 11px; color: var(--faint);
  }
  .arr { color: var(--faint); font-size: 12px; }

  /* 符文（LoL 游戏内符文页：主系/副系两列，高亮选中、置灰未选） */
  .rune-page { display: flex; justify-content: center; gap: 30px; }
  .rune-path { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .rune-head { font-size: 12px; color: var(--faint); margin-bottom: 8px; white-space: nowrap; }
  /* 副系无基石，标题后留出基石行的高度，使三行与主系对齐 */
  .rune-path.secondary .rune-head { margin-bottom: 54px; }
  .rune-candidates { display: flex; gap: 12px; }
  .rune-slot {
    width: 28px; height: 28px; border-radius: 50%;
    background: #0A1520; border: 1.5px solid #2A3F55;
    opacity: .4;
  }
  .rune-candidates.keystone .rune-slot { width: 36px; height: 36px; }
  .rune-slot.on {
    opacity: 1; border-color: var(--gold);
    box-shadow: 0 0 10px rgba(200,170,110,.35);
  }
  .rune-path.secondary .rune-slot.on {
    border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(10,200,185,.35);
  }
  /* 属性碎片：第三列，3 行每行 3 选 1，与主副系符文行对齐 */
  .shards {
    display: flex; flex-direction: column; justify-content: flex-start;
    gap: 18px; padding-left: 24px;
    border-left: 1px solid var(--line-soft);
  }
  .shards .rune-head { margin-bottom: 58px; }
  .shard-row { display: flex; gap: 10px; }
  .shard {
    width: 20px; height: 20px; border-radius: 50%;
    background: #0A1520; border: 1.5px solid #2A3F55; opacity: .4;
  }
  .shard.on { opacity: 1; border-color: var(--gold); box-shadow: 0 0 8px rgba(200,170,110,.35); }
  .rune-note {
    margin-top: 22px; padding-top: 16px;
    border-top: 1px solid var(--line-soft);
    font-size: 12px; color: var(--faint); line-height: 1.8;
  }

  /* ============ 相关视频 ============ */
  .videos {
    margin-top: 26px;
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: 16px;
    padding: 26px 30px 30px;
  }
  .video-search { display: flex; gap: 10px; margin-bottom: 22px; }
  .video-search input {
    flex: 1; height: 38px; padding: 0 14px;
    background: #0A1520; border: 1px solid var(--line); border-radius: 8px;
    color: var(--gold-bright); font-size: 13px; font-family: inherit;
    outline: none;
  }
  .video-search input::placeholder { color: var(--faint); }
  .video-search input:focus { border-color: var(--gold); }
  .video-search button {
    height: 38px; padding: 0 22px;
    background: var(--gold); border: none; border-radius: 8px;
    color: #0A1520; font-size: 13px; font-weight: 700; font-family: inherit;
    cursor: pointer;
  }
  /* 九宫格 */
  .video-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .video-card { cursor: pointer; }
  .video-thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #0A1520; border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden;
    display: grid; place-items: center;
  }
  .video-card:hover .video-thumb { border-color: var(--gold); }
  .video-badge {
    position: absolute; left: 0; top: 0;
    font-size: 11px; font-weight: 700; line-height: 1;
    padding: 5px 10px;
    border-radius: 10px 0 8px 0;
    color: #04141A;
  }
  .video-thumb.pro { border-color: rgba(10,200,185,.55); }
  .video-thumb.con { border-color: rgba(232,64,87,.55); }
  .video-badge.pro { background: var(--cyan); }
  .video-badge.con { background: var(--red); color: var(--gold-bright); }
  .video-thumb .play {
    width: 0; height: 0;
    border-left: 16px solid var(--faint);
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
  }
  .video-card:hover .play { border-left-color: var(--gold); }
  .video-thumb .dur {
    position: absolute; right: 8px; bottom: 8px;
    font-size: 11px; color: var(--mute);
    background: rgba(7,14,22,.75); border-radius: 4px; padding: 1px 6px;
  }
  .video-title {
    margin-top: 9px; font-size: 13px; color: var(--gold-bright);
    line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .video-meta { margin-top: 4px; font-size: 11.5px; color: var(--faint); }
  /* 分页 */
  .pager { display: flex; justify-content: center; gap: 8px; margin-top: 26px; }
  .pager button {
    font-family: inherit; font-size: 12.5px; cursor: pointer;
    background: none; border: 1px solid var(--line); border-radius: 8px;
    color: var(--faint); min-width: 30px; height: 28px; padding: 0 8px;
  }
  .pager button:hover { color: var(--mute); }
  .pager button.on { border-color: var(--gold); color: var(--gold); }
  .pager button:disabled { opacity: .35; cursor: default; }
</style>
</head>

  <script>
    document.querySelectorAll('.tabs').forEach(function (group) {
      group.addEventListener('click', function (e) {
        var btn = e.target.closest('.tab');
        if (!btn) return;
        var box = group.closest('.build');
        box.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('on'); });
        btn.classList.add('on');
        box.querySelectorAll('.panel').forEach(function (p) {
          p.classList.toggle('on', p.id === btn.dataset.panel);
        });
      });
    });

    /* ============ 相关视频：占位数据 + 九宫格分页 ============ */
    (function () {
      var TOTAL = 15;      // 占位视频总数
      var SIZE = 9;        // 每页 9 个（九宫格）
      var page = 1;

      var grid = document.getElementById('videoGrid');
      var pager = document.getElementById('videoPager');

      function renderGrid() {
        var start = (page - 1) * SIZE;
        var count = Math.min(SIZE, TOTAL - start);
        var html = '';
        for (var i = 0; i < count; i++) {
          // 交替演示操作你 / 被操作
          var isPro = (start + i) % 2 === 0;
          html +=
            '<div class="video-card" onclick="location.href=\'视频详情页.html\'">' +
              '<div class="video-thumb ' + (isPro ? 'pro' : 'con') + '">' +
                '<span class="video-badge ' + (isPro ? 'pro' : 'con') + '">' +
                  (isPro ? '操作你' : '被操作') + '</span>' +
                '<span class="play"></span>' +
                '<span class="dur">12:34</span></div>' +
              '<div class="video-title">视频标题占位 ' + (start + i + 1) + '</div>' +
              '<div class="video-meta">UP主占位 · 播放量占位</div>' +
            '</div>';
        }
        grid.innerHTML = html;
      }

      function renderPager() {
        var pages = Math.ceil(TOTAL / SIZE);
        var html = '<button data-act="prev"' + (page === 1 ? ' disabled' : '') + '>上一页</button>';
        for (var i = 1; i <= pages; i++) {
          html += '<button data-act="page" data-page="' + i + '"' +
            (i === page ? ' class="on"' : '') + '>' + i + '</button>';
        }
        html += '<button data-act="next"' + (page === pages ? ' disabled' : '') + '>下一页</button>';
        pager.innerHTML = html;
      }

      pager.addEventListener('click', function (e) {
        var btn = e.target.closest('button');
        if (!btn || btn.disabled) return;
        var act = btn.dataset.act;
        var pages = Math.ceil(TOTAL / SIZE);
        if (act === 'prev') page = Math.max(1, page - 1);
        else if (act === 'next') page = Math.min(pages, page + 1);
        else page = Number(btn.dataset.page);
        renderGrid();
        renderPager();
      });

      document.getElementById('videoBtn').addEventListener('click', function () {
        page = 1;
        renderGrid();
        renderPager();
      });
      document.getElementById('videoKw').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('videoBtn').click();
      });

      renderGrid();
      renderPager();
    })();
  </script>

</body>
</html>
